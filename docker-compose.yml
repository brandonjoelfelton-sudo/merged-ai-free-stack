name: merged-ai-free-stack

services:
  ollama:
    image: ollama/ollama:latest
    container_name: brain-ollama
    environment:
      # lets browser apps (e.g. the MUSE site) call the brain from localhost
      - OLLAMA_ORIGINS=*
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: brain-ui
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=MERGED AI FREE STACK
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: dots-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Indiana/Indianapolis
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/opt/workflows:ro
    depends_on:
      - ollama
    restart: unless-stopped

  gpt-researcher:
    image: gptresearcher/gpt-researcher:latest
    container_name: rea-researcher
    profiles: ["research"]
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - FAST_LLM=ollama:llama3.1:8b
      - SMART_LLM=ollama:llama3.1:8b
      - EMBEDDING_PROVIDER=ollama
      - OLLAMA_EMBEDDING_MODEL=nomic-embed-text
      - RETRIEVER=tavily
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    depends_on:
      - ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memory-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  ollama_data:
  open_webui_data:
  n8n_data:
  qdrant_data:
